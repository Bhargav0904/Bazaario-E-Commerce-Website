spring.application.name=bazaario-backend

# --- Database (match your existing MySQL setup) ---
spring.datasource.url=jdbc:mariadb://localhost:3307/ecommerce
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# ddl-auto=update lets Hibernate create/adjust tables from your @Entity classes automatically.
# Since you already have tables from the JDBC version, Hibernate will just verify/adjust them
# to match - back up your DB first if you want to be cautious, or use ddl-auto=validate instead
# once the schema is confirmed to match.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (hibernate.dialect removed - Hibernate 7 auto-detects MySQL)

# --- Server ---
server.port=8080

# --- JWT ---
# 256-bit+ secret required for HS256. Generate your own random string for real use -
# this is a placeholder so the app runs out of the box.
app.jwt.secret=ChangeThisToARandomAtLeast32CharacterSecretKeyForBazaario2026
app.jwt.expiration-ms=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

app.mail.enabled=true
app.mail.login-alert-enabled=true
app.mail.from-name=Bazaario
app.mail.from=
app.mail.frontend-url=http://localhost:4200
