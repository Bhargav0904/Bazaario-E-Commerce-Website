<div class="auth-card">
  <h2>Create your account</h2>

  @if (errorMessage()) {
    <div class="alert alert-error">{{ errorMessage() }}</div>
  }

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="form-group">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" [(ngModel)]="form.fullName" required />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="form.email" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="form.password" required minlength="6" />
    </div>
    <div class="form-group">
      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone" [(ngModel)]="form.phone" />
    </div>
    <div class="form-group">
      <label for="address">Address (optional)</label>
      <textarea id="address" name="address" [(ngModel)]="form.address"></textarea>
    </div>
    <button type="submit" [disabled]="!registerForm.valid">Create account</button>
  </form>

  <p>Already have an account? <a routerLink="/login">Log in</a></p>
</div>
